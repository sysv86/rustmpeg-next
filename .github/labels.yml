# Label taxonomy for rustmpeg-next.
# Synced by .github/workflows/labels.yml (EndBug/label-sync).
# Every label referenced by an issue form or the PR template must exist here.
# Colours are six-digit hex without a leading '#'.

# ---------------------------------------------------------------------------
# type/* - what kind of work this is
# ---------------------------------------------------------------------------
- name: "type/bug"
  color: "d73a4a"
  description: "Reproducible defect in implemented behavior."
- name: "type/feature"
  color: "0e8a16"
  description: "New capability within the current docs/CONCEPT.md matrix."
- name: "type/conformance"
  color: "5319e7"
  description: "Bitstream, reconstruction, or entropy mismatch against a named oracle."
- name: "type/performance"
  color: "fbca04"
  description: "Measured speed, memory, or throughput change; requires numbers."
- name: "type/security"
  color: "b60205"
  description: "Memory safety, DoS, or dependency vulnerability. Report privately first."
- name: "type/docs"
  color: "0075ca"
  description: "Documentation, specification notes, or examples."
- name: "type/refactor"
  color: "c5def5"
  description: "Internal restructuring with no intended behavior change."
- name: "type/chore"
  color: "fef2c0"
  description: "Build, CI, tooling, or repository maintenance."
- name: "type/question"
  color: "d876e3"
  description: "Usage or design question that is not yet a change request."

# ---------------------------------------------------------------------------
# area/* - which part of the workspace owns the change
# ---------------------------------------------------------------------------
- name: "area/core"
  color: "1d76db"
  description: "rustmpeg-core: buffers, time, formats, packets, errors, SIMD."
- name: "area/format"
  color: "006b75"
  description: "rustmpeg-format: EBML, Matroska/WebM, ISOBMFF/CMAF, MoQ."
- name: "area/audio"
  color: "0e8a16"
  description: "rustmpeg-audio: Opus, FLAC, LPCM, LC3, IAMF."
- name: "area/image"
  color: "c2e0c6"
  description: "rustmpeg-image: JPEG XL, OpenEXR, colour management."
- name: "area/video"
  color: "5319e7"
  description: "rustmpeg-video: AV2, VVC, APV codecs and codec-side traits."
- name: "area/vulkan"
  color: "6f42c1"
  description: "rustmpeg-vulkan: WGSL kernels, scheduler, calibration."
- name: "area/cli"
  color: "0052cc"
  description: "rustmpeg-cli and the command-line surface."
- name: "area/docs"
  color: "0075ca"
  description: "docs/, README, rustdoc, and specification citations."
- name: "area/ci"
  color: "24292e"
  description: "GitHub Actions, issue forms, labels, and repository automation."
- name: "area/build"
  color: "bfdadc"
  description: "Cargo manifests, toolchain pin, feature flags, licensing scripts."

# ---------------------------------------------------------------------------
# codec/* - codec, container, image, or transport specific work
# ---------------------------------------------------------------------------
- name: "codec/av2"
  color: "1d76db"
  description: "AOMedia AV2 video codec (experimental software encoder/decoder)."
- name: "codec/vvc"
  color: "0052cc"
  description: "ITU-T H.266/VVC (VTM-derived intra profile and subset decoder)."
- name: "codec/apv"
  color: "5319e7"
  description: "APV / RFC 9924 intra mezzanine codec."
- name: "codec/opus"
  color: "0e8a16"
  description: "Opus packet/range layer, SILK, CELT, hybrid, PLC."
- name: "codec/flac"
  color: "006b75"
  description: "FLAC lossless audio codec (RFC 9639)."
- name: "codec/lpcm"
  color: "bfdadc"
  description: "Linear PCM sample formats and packing."
- name: "codec/lc3"
  color: "fbca04"
  description: "Bluetooth LC3 / LC3plus low-power audio."
- name: "codec/iamf"
  color: "d876e3"
  description: "IAMF immersive audio container, metadata, and OAR rendering."
- name: "codec/isobmff"
  color: "c5def5"
  description: "ISOBMFF / CMAF / fragmented MP4 muxing and demuxing."
- name: "codec/matroska"
  color: "bfdadc"
  description: "EBML, Matroska v4, and the WebM profile."
- name: "codec/moq"
  color: "1d76db"
  description: "Media over QUIC transport (moq-transport)."
- name: "codec/jpeg-xl"
  color: "fef2c0"
  description: "JPEG XL still image and animation pipeline."
- name: "codec/openexr"
  color: "ededed"
  description: "OpenEXR multi-layer HDR image pipeline."

# ---------------------------------------------------------------------------
# priority/* - triage urgency, set by maintainers
# ---------------------------------------------------------------------------
- name: "priority/critical"
  color: "b60205"
  description: "Corrupt output, security issue, or blocked release; fix immediately."
- name: "priority/high"
  color: "d93f0b"
  description: "Correctness or conformance defect affecting a supported path."
- name: "priority/medium"
  color: "fbca04"
  description: "Normal scheduled work with a clear impact."
- name: "priority/low"
  color: "0e8a16"
  description: "Nice to have; no current user is blocked."

# ---------------------------------------------------------------------------
# status/* - lifecycle, set by maintainers
# ---------------------------------------------------------------------------
- name: "status/needs-triage"
  color: "fbca04"
  description: "New issue or PR; not yet evaluated by a maintainer."
- name: "status/needs-info"
  color: "d876e3"
  description: "Waiting on the reporter for a reproduction, version, or evidence."
- name: "status/blocked"
  color: "5319e7"
  description: "Cannot proceed until another issue, dependency, or decision lands."
- name: "status/ready"
  color: "0e8a16"
  description: "Scoped and accepted; ready for implementation."
- name: "status/in-progress"
  color: "1d76db"
  description: "Implementation is actively underway."
- name: "status/duplicate"
  color: "cfd3d7"
  description: "Already tracked by another issue."
- name: "status/wontfix"
  color: "ffffff"
  description: "Out of scope or intentionally not planned; reason recorded in the thread."

# ---------------------------------------------------------------------------
# community - entry points for general users and new contributors
# ---------------------------------------------------------------------------
- name: "community/newcomer"
  color: "7057ff"
  description: "Lightweight report or task for general users and newcomers; no strict reproduction rules."

