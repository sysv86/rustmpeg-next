name: README stats

on:
  push:
    branches: [main]
    paths:
      - "crates/**/*.rs"
      - "Cargo.toml"
      - "docs/status.json"
      - "scripts/readme_stats.py"
      - ".github/workflows/readme-stats.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Update README footer
        run: python3 scripts/readme_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README stats unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: refresh README stats [skip ci]"
          git push
